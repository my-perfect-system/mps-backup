---
- name: "BACKUP - Create ssh folder"
  become: true
  become_user: "{{ entity.name }}"
  ansible.builtin.file:
    path: "{{ entity.home }}/.ssh/"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "BACKUP - Sync ssh keys"
  ansible.posix.synchronize:
    src: "{{ backup_ssh_source }}/keys/"
    dest: "{{ entity.home }}/.ssh/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "BACKUP - Sync ssh config"
  ansible.posix.synchronize:
    src: "{{ backup_ssh_source }}/config/"
    dest: "{{ entity.home }}/.ssh/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "BACKUP - Sync ssh authorized keys"
  ansible.posix.synchronize:
    src: "{{ backup_ssh_source }}/authorized/"
    dest: "{{ entity.home }}/.ssh/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "BACKUP - Fix ssh permissions"
  become: true
  ansible.builtin.file:
    path: "{{ entity.home }}/.ssh"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "BACKUP - Restore Brave bookmarks"
  become: true
  become_user: "{{ entity.name }}"
  ansible.builtin.copy:
    src: "{{ backup_source }}/brave/Bookmarks"
    dest: "{{ entity.home }}/.config/BraveSoftware/Brave-Browser/Default/Bookmarks"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: backup_persist_brave

- name: "BACKUP - Sync homedir"
  ansible.posix.synchronize:
    src: "{{ backup_source }}/home/"
    dest: "{{ entity.home }}/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ backup_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
