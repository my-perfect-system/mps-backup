---
- name: Create per-user ssh directory
  become: true
  become_user: "{{ entity.name }}"
  ansible.builtin.file:
    path: "{{ entity.home }}/.ssh/"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Restore ssh private keys per user
  ansible.posix.synchronize:
    src: "{{ backup_ssh_source }}/keys/"
    dest: "{{ entity.home }}/.ssh/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Restore ssh config per user
  ansible.posix.synchronize:
    src: "{{ backup_ssh_source }}/config/"
    dest: "{{ entity.home }}/.ssh/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Restore ssh authorized keys per user
  ansible.posix.synchronize:
    src: "{{ backup_ssh_source }}/authorized/"
    dest: "{{ entity.home }}/.ssh/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Fix ssh directory permissions per user
  become: true
  ansible.builtin.file:
    path: "{{ entity.home }}/.ssh"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Restore Brave bookmarks per user
  become: true
  become_user: "{{ entity.name }}"
  ansible.builtin.copy:
    src: "{{ backup_source }}/brave/Bookmarks"
    dest: "{{ entity.home }}/.config/BraveSoftware/Brave-Browser/Default/Bookmarks"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: backup_enable_persist_brave

- name: Restore home directory per user
  ansible.posix.synchronize:
    src: "{{ backup_source }}/home/"
    dest: "{{ entity.home }}/"
    recursive: true
    delete: false
  become: true
  become_user: "{{ entity.name }}"
  loop: "{{ identity_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
